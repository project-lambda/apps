name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Fired by the fortress-group repo when it changes (see its publish workflow).
  repository_dispatch:
    types: [fortress-group-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          # Pages reports the real address: the custom domain once one is set,
          # otherwise https://<user>.github.io/<repo>.
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # ---- Fortress Group site, served at /fortress-group ----
      - uses: actions/checkout@v4
        with:
          repository: project-lambda/fortress-group
          path: .fortress
      - run: npm ci
        working-directory: .fortress
      # Route handlers cannot be statically exported; the live form API stays on Vercel.
      - run: rm -rf src/app/api && npm run build
        working-directory: .fortress
        env:
          GH_PAGES: "1"
          NEXT_PUBLIC_LEAD_API: https://fortress-group-nine.vercel.app
      - run: |
          rm -rf dist/fortress-group
          mkdir -p dist/fortress-group
          cp -R .fortress/out/. dist/fortress-group/
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
